name: Daily Auto-Commit

on:
  schedule:
# 18:30 UTC = midnight IST (11:59 PM IST effectively next day).
  # Adjust to your timezone: IST is UTC+5:30, so 23:00 IST = 17:30 UTC → "30 17 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'shaunakmishra25'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "shaunakmishra25"
          git config user.email "shaunakmishra25@users.noreply.github.com"

      - name: Commit new changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"

      - name: Push to main
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main